# Installed into .git/hooks by .devcontainer/postStartCommand.sh.
#
# Every step runs only on the staged files that match its glob, passed in as
# {staged_files}. A step with no matching files is skipped. A step that exits
# non-zero blocks the commit. Steps run one after another and stop at the first
# failure (piped: true).
#
# Real checks: gitleaks on every commit, Rust lint (cargo fmt and clippy) when
# Rust or Cargo files are staged, and actionlint plus zizmor on staged workflows.
# Steps marked PLACEHOLDER call .lefthook/placeholder.sh, which prints that no
# check ran; the Rust test, duplication, complexity and cargo-deny steps are still
# placeholders. Other file types are checked by the secret scan only and skipped
# by other steps. {staged_files} covers added, copied, modified and renamed files;
# deleted files are not passed.
# To add a language's checks, see docs/conventions.md.
pre-commit:
  piped: true
  commands:
    1-gitleaks:
      run: gitleaks git --pre-commit --staged --redact --no-banner --verbose

    # Rust lint, the same commands as CI's image job. Runs when a .rs file,
    # Cargo.toml or Cargo.lock is staged, at any depth. cargo checks the whole
    # workspace as it is on disk, not only the staged files, so every crate in
    # `members` is covered with no change here.
    2-lint:
      glob: "{*.rs,Cargo.toml,Cargo.lock,**/Cargo.toml,**/Cargo.lock}"
      run: cargo fmt --all --check && cargo clippy --workspace --all-targets --locked -- -D warnings

    # PLACEHOLDER until PR 7 (PR 2 for the registry app).
    3-test:
      glob: "*.rs"
      run: .lefthook/placeholder.sh test "PR 7" {staged_files}

    # PLACEHOLDER until PR 7 (PR 2 for the registry app).
    4-duplication-complexity:
      glob: "*.rs"
      run: .lefthook/placeholder.sh duplication-and-complexity "PR 7" {staged_files}

    # PLACEHOLDER until PR 7 installs cargo-deny. Runs only when a manifest or lockfile changes.
    5-cargo-deny:
      glob: "{Cargo.toml,Cargo.lock,**/Cargo.toml,**/Cargo.lock}"
      run: .lefthook/placeholder.sh cargo-deny "PR 7" {staged_files}

    6-actionlint:
      glob: ".github/workflows/*.{yml,yaml}"
      run: actionlint {staged_files}

    7-zizmor:
      glob: ".github/workflows/*.{yml,yaml}"
      # Offline checks are fast, deterministic and need no GitHub token.
      run: zizmor --offline --persona=pedantic {staged_files}
