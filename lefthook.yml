# Installed into .git/hooks by .devcontainer/postStartCommand.sh.
#
# Steps run when staged files match their glob. File-based tools receive
# {staged_files}; cargo-deny checks the workspace. No matches skips a step.
# A step that exits non-zero blocks the commit. Steps run one after another and stop at the first
# failure (piped: true).
#
# Steps marked PLACEHOLDER call .lefthook/placeholder.sh, which prints that no
# check ran. The .rs steps remain placeholders until their tools are installed;
# workflows have real lint steps and manifest or
# lockfile changes run cargo-deny for the workspace. Other types
# are checked by the secret scan only and skipped by other steps. {staged_files} covers
# added, copied, modified and renamed files; deleted files are not passed.
# To add a language's checks, see docs/conventions.md.
pre-commit:
  piped: true
  commands:
    1-gitleaks:
      run: gitleaks git --pre-commit --staged --redact --no-banner --verbose

    # PLACEHOLDER until PR 7 installs clippy (PR 2 for the registry app's language).
    2-lint:
      glob: "*.rs"
      run: .lefthook/placeholder.sh lint "PR 7" {staged_files}

    # PLACEHOLDER until PR 7 (PR 2 for the registry app).
    3-test:
      glob: "*.rs"
      run: .lefthook/placeholder.sh test "PR 7" {staged_files}

    # PLACEHOLDER until PR 7 (PR 2 for the registry app).
    4-duplication-complexity:
      glob: "*.rs"
      run: .lefthook/placeholder.sh duplication-and-complexity "PR 7" {staged_files}

    # Check the workspace's dependencies when a manifest or lockfile changes.
    5-cargo-deny:
      glob: "{Cargo.toml,Cargo.lock,**/Cargo.toml,**/Cargo.lock}"
      run: cargo deny --locked check

    6-actionlint:
      glob: ".github/workflows/*.{yml,yaml}"
      run: actionlint {staged_files}

    7-zizmor:
      glob: ".github/workflows/*.{yml,yaml}"
      # Offline checks are fast, deterministic and need no GitHub token.
      run: zizmor --offline --persona=pedantic {staged_files}
