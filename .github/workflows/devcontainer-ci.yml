name: devcontainer

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      IMAGE: family-ai-devcontainer:ci
      CST_VERSION: v1.22.1
      CST_SHA256: fa35e89512a8978585f76cf41397956d2e3a30c62c2ad3fb857b1597074d14ca
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history, so gitleaks scans every commit, not just the tip.
          fetch-depth: 0
          persist-credentials: false

      - name: Validate compose files
        run: |
          HOST_SSH_AUTH_SOCK=/dev/null docker compose \
            -f .devcontainer/docker-compose.yml \
            -f .devcontainer/compose.ssh.yml \
            -f .devcontainer/compose.docker.yml \
            config --quiet

      - name: Build image
        run: docker build -f .devcontainer/Dockerfile -t "$IMAGE" .

      - name: Install container-structure-test
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL --retry 5 -o "$RUNNER_TEMP/bin/container-structure-test" \
            "https://github.com/GoogleContainerTools/container-structure-test/releases/download/${CST_VERSION}/container-structure-test-linux-amd64"
          echo "${CST_SHA256}  $RUNNER_TEMP/bin/container-structure-test" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/bin/container-structure-test"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Structure test
        run: container-structure-test test --image "$IMAGE" --config .devcontainer/container-structure-test.yaml

      # Backstop for commits made outside the container, where the lefthook
      # pre-commit hook does not run.
      - name: Secret scan (full history)
        run: |
          # Run as the checkout's owner, or git rejects the repo as "dubious ownership".
          docker run --rm --entrypoint gitleaks --user "$(id -u):$(id -g)" -e HOME=/tmp \
            -v "$PWD:/repo" -w /repo "$IMAGE" \
            git --redact --no-banner --verbose .

      # The commit hook's own configuration, run over every tracked file instead of
      # only staged ones. Today this checks that lefthook.yml parses and runs, and
      # the placeholder steps skip because no .rs or Cargo.* files exist. Once PR 2
      # and PR 7 replace the placeholders it runs the real lint, test, duplication,
      # complexity and cargo-deny checks over the whole tree. The hook's gitleaks
      # step only looks at staged changes, so with nothing staged it scans nothing;
      # the full-history scan above is the real secret check.
      - name: Commit-hook checks (whole tree)
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp \
            -v "$PWD:/repo" -w /repo "$IMAGE" \
            lefthook run pre-commit --all-files

  # Starts the container the way start.sh does and checks it behaves: SSH agent
  # forwarding, Claude settings, commit hook, project toolchain, nested Docker, and
  # dropping back to unprivileged. The runner's UID (1001) also exercises the
  # image's UID remapping, which the default 1000 build above does not.
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Smoke test
        run: .devcontainer/smoke-test.sh

  # The single required status check. Branch protection requires this job's name
  # (`ci`) and nothing else, so adding or renaming jobs above never means
  # touching the settings, as long as they are listed in needs. `if: always()`
  # makes it run even when a needed job failed; without it a failed job would
  # leave this one skipped, and GitHub treats a skipped required check as
  # passing. Anything other than `success` (failed, cancelled, skipped) fails it.
  ci:
    name: ci
    if: always()
    needs: [image, smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      IMAGE_RESULT: ${{ needs.image.result }}
      SMOKE_RESULT: ${{ needs.smoke.result }}
    steps:
      - name: Require every needed job to have succeeded
        run: |
          echo "image: $IMAGE_RESULT"
          echo "smoke: $SMOKE_RESULT"
          {
            echo "## CI gate"
            echo
            echo "| Job | Result |"
            echo "| --- | --- |"
            echo "| image (compose, build, structure test, full-history secret scan, hook over whole tree) | $IMAGE_RESULT |"
            echo "| smoke | $SMOKE_RESULT |"
            echo
            echo "**Not wired yet (these checks do not run):** lint, tests, duplication and complexity, and dependency license checks (\`cargo-deny\`). They arrive with PR 2 (registry app) and PR 7 (family app). Until then the hook's steps for them are placeholders."
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$IMAGE_RESULT" != success ] || [ "$SMOKE_RESULT" != success ]; then
            echo "A needed job did not succeed." >&2
            exit 1
          fi
