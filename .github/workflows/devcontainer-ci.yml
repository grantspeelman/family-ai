name: devcontainer

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  image:
    name: image
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      IMAGE: family-ai-devcontainer:ci
      CST_VERSION: v1.22.1
      CST_SHA256: fa35e89512a8978585f76cf41397956d2e3a30c62c2ad3fb857b1597074d14ca
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history, so gitleaks scans every commit, not just the tip.
          fetch-depth: 0
          persist-credentials: false

      - name: Validate compose files
        run: |
          HOST_SSH_AUTH_SOCK=/dev/null docker compose \
            -f .devcontainer/docker-compose.yml \
            -f .devcontainer/compose.ssh.yml \
            -f .devcontainer/compose.docker.yml \
            config --quiet

      - name: Build image
        run: docker build -f .devcontainer/Dockerfile -t "$IMAGE" .

      - name: Install container-structure-test
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL --retry 5 -o "$RUNNER_TEMP/bin/container-structure-test" \
            "https://github.com/GoogleContainerTools/container-structure-test/releases/download/${CST_VERSION}/container-structure-test-linux-amd64"
          echo "${CST_SHA256}  $RUNNER_TEMP/bin/container-structure-test" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/bin/container-structure-test"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Structure test
        run: container-structure-test test --image "$IMAGE" --config .devcontainer/container-structure-test.yaml

      # Every tracked *.bats file, found by git, run in one bats invocation inside
      # the image just built, so the tests use the same pinned bats-core as the dev
      # container (Dockerfile BATS_VERSION and BATS_SHA256 are the only pin). A new
      # test file needs no change here. Zero files is a failure: the repo has at
      # least one, so zero means discovery broke, not that there is nothing to test.
      - name: Bats tests (every tracked *.bats)
        run: |
          mapfile -d '' bats_files < <(git ls-files -z -- '*.bats')
          if [ "${#bats_files[@]}" -eq 0 ]; then
            echo "no .bats files found, or git ls-files failed" >&2
            exit 1
          fi
          # A leading ./ keeps a name that starts with - from being read as a bats option.
          bats_files=("${bats_files[@]/#/./}")
          printf 'Running %d bats file(s):\n' "${#bats_files[@]}"
          printf '  %s\n' "${bats_files[@]}"
          docker run --rm --entrypoint bats --user "$(id -u):$(id -g)" -e HOME=/tmp \
            -v "$PWD:/repo" -w /repo "$IMAGE" \
            "${bats_files[@]}"

      # cargo fmt and clippy on the whole Cargo workspace, the same commands as the
      # pre-commit hook's 2-lint step, in the image just built: the dev container's
      # Rust 1.93 with clippy and rustfmt, so no third-party action sets up Rust.
      # No -p flags or paths, so a crate added to the workspace's `members` is
      # covered with no change here. Run as the checkout's owner so target/ is
      # writable and owned by the runner.
      - name: cargo fmt
        run: |
          docker run --rm --entrypoint cargo --user "$(id -u):$(id -g)" \
            -e HOME=/tmp -e CARGO_HOME=/tmp/cargo \
            -v "$PWD:/repo" -w /repo "$IMAGE" \
            fmt --all --check

      - name: cargo clippy
        run: |
          docker run --rm --entrypoint cargo --user "$(id -u):$(id -g)" \
            -e HOME=/tmp -e CARGO_HOME=/tmp/cargo \
            -v "$PWD:/repo" -w /repo "$IMAGE" \
            clippy --workspace --all-targets --locked -- -D warnings

      # Backstop for commits made outside the container, where the lefthook
      # pre-commit hook does not run.
      - name: Secret scan (full history)
        run: |
          # Run as the checkout's owner, or git rejects the repo as "dubious ownership".
          docker run --rm --entrypoint gitleaks --user "$(id -u):$(id -g)" -e HOME=/tmp \
            -v "$PWD:/repo" -w /repo "$IMAGE" \
            git --redact --no-banner --verbose .

  # Starts the container the way start.sh does and checks it behaves: SSH agent
  # forwarding, Claude settings, commit hook, project toolchain, nested Docker, and
  # dropping back to unprivileged. The runner's UID (1001) also exercises the
  # image's UID remapping, which the default 1000 build above does not.
  smoke:
    name: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Smoke test
        run: .devcontainer/smoke-test.sh

  # Workflow safety rules (docs/conventions.md, "Workflow safety"). actionlint checks
  # syntax, expressions and shell scripts; zizmor parses YAML for security audits.
  # Use the same offline audits and persona as the pre-commit hook.
  workflows:
    name: workflows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ZIZMOR_VERSION: 1.31.1
      ZIZMOR_SHA256: d185f726bdaf92df78273217dfdd24ebcd6b0ef48cf3ce776ff5762b6e138c99
      ACTIONLINT_VERSION: 1.7.12
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install actionlint
        run: |
          mkdir -p "$RUNNER_TEMP/actionlint"
          curl -fsSL --retry 5 -o "$RUNNER_TEMP/actionlint.tar.gz" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP/actionlint" actionlint
          echo "$RUNNER_TEMP/actionlint" >> "$GITHUB_PATH"

      - name: Install zizmor
        run: |
          mkdir -p "$RUNNER_TEMP/zizmor"
          curl -fsSL --retry 5 -o "$RUNNER_TEMP/zizmor.tar.gz" \
            "https://github.com/zizmorcore/zizmor/releases/download/v${ZIZMOR_VERSION}/zizmor-x86_64-unknown-linux-gnu.tar.gz"
          echo "${ZIZMOR_SHA256}  $RUNNER_TEMP/zizmor.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/zizmor.tar.gz" -C "$RUNNER_TEMP/zizmor" zizmor
          echo "$RUNNER_TEMP/zizmor" >> "$GITHUB_PATH"

      - name: actionlint
        run: actionlint -color

      - name: zizmor
        run: zizmor --offline --persona=pedantic .github/workflows/

  # All workspace dependencies: licenses, RustSec advisories, bans and sources.
  cargo-deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CARGO_DENY_VERSION: 0.20.2
      CARGO_DENY_SHA256: 9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install cargo-deny
        run: |
          tool_dir="cargo-deny-${CARGO_DENY_VERSION}-x86_64-unknown-linux-musl"
          mkdir -p "$RUNNER_TEMP/cargo-deny"
          curl -fsSL --retry 5 -o "$RUNNER_TEMP/cargo-deny.tar.gz" \
            "https://github.com/EmbarkStudios/cargo-deny/releases/download/${CARGO_DENY_VERSION}/${tool_dir}.tar.gz"
          echo "${CARGO_DENY_SHA256}  $RUNNER_TEMP/cargo-deny.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/cargo-deny.tar.gz" -C "$RUNNER_TEMP/cargo-deny" --strip-components=1 "$tool_dir/cargo-deny"
          echo "$RUNNER_TEMP/cargo-deny" >> "$GITHUB_PATH"

      - name: Check workspace dependencies
        run: cargo deny --locked check

  # The tests of the whole Cargo workspace (every crate in `members`, such as the
  # registry and fly-mock), then the registry image built from registry/Dockerfile,
  # started and queried over HTTP. cargo runs in the Dockerfile's `toolchain` stage,
  # the Rust image the release build starts from, so the Rust tag is set in one place
  # and no third-party action sets up Rust.
  registry:
    name: registry
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      REGISTRY_TOOLCHAIN_IMAGE: family-ai-registry-toolchain:ci
      REGISTRY_IMAGE: family-ai-registry:ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build toolchain image
        run: docker build -f registry/Dockerfile --target toolchain -t "$REGISTRY_TOOLCHAIN_IMAGE" .

      # `cargo test` at the workspace root with no -p flags, so a crate added to
      # `members` is tested with no change here. Run as the checkout's owner so
      # target/ is writable and owned by the runner.
      - name: Cargo tests
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -e CARGO_HOME=/tmp/cargo \
            -v "$PWD:/repo" -w /repo "$REGISTRY_TOOLCHAIN_IMAGE" \
            cargo test --locked

      - name: Build image
        run: docker build -f registry/Dockerfile -t "$REGISTRY_IMAGE" .

      - name: Run image and query it
        run: |
          container=registry-ci
          # Always show the logs and remove the container, pass or fail.
          trap 'docker logs "$container" || true; docker rm -f "$container" >/dev/null 2>&1 || true' EXIT
          docker run -d --name "$container" -p 127.0.0.1:8080:8080 "$REGISTRY_IMAGE"

          ready=false
          for _ in $(seq 1 30); do
            if [ "$(curl -fsS http://127.0.0.1:8080/healthz 2>/dev/null)" = "ok" ]; then
              ready=true
              break
            fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            echo "registry did not answer /healthz within 30 seconds" >&2
            exit 1
          fi

          if [ "$(docker exec "$container" id -u)" != "10001" ]; then
            echo "registry is not running as UID 10001" >&2
            exit 1
          fi

          expected=$(grep -m1 '^version = ' registry/Cargo.toml | cut -d'"' -f2)
          if [ -z "$expected" ]; then
            echo "could not read the version from registry/Cargo.toml" >&2
            exit 1
          fi
          response=$(curl -fsS -H 'Content-Type: application/json' \
            -d '{"query":"{ apiVersion }"}' http://127.0.0.1:8080/graphql)
          echo "$response"
          jq -e --arg v "$expected" '.data.apiVersion == $v' <<<"$response"

  # Line coverage for the whole Cargo workspace, gated on a floor. cargo runs in
  # the registry Dockerfile's `toolchain` stage, like the `registry` job, so the
  # Rust tag is set in one place and no third-party action sets up Rust. rustup
  # adds llvm-tools-preview for that toolchain's own Rust version. `--workspace`
  # with no -p flags, so a crate added to `members` is measured with no change here.
  coverage:
    name: coverage
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      REGISTRY_TOOLCHAIN_IMAGE: family-ai-registry-toolchain:ci
      # The asset digest published on the release page.
      CARGO_LLVM_COV_VERSION: 0.9.1
      CARGO_LLVM_COV_SHA256: 3fca950394a3c49457657c158b1619cec8dfd2647ae5b48746734c0ab969a522
      # Minimum workspace line coverage, in percent. Deliberately generous: it
      # catches a collapse (tests not running, say), not normal drift. main
      # measured 19.61% when this was set. Tighten it later with real data.
      COVERAGE_FLOOR: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install cargo-llvm-cov
        run: |
          mkdir -p "$RUNNER_TEMP/cargo-llvm-cov"
          curl -fsSL --retry 5 -o "$RUNNER_TEMP/cargo-llvm-cov.tar.gz" \
            "https://github.com/taiki-e/cargo-llvm-cov/releases/download/v${CARGO_LLVM_COV_VERSION}/cargo-llvm-cov-x86_64-unknown-linux-musl.tar.gz"
          echo "${CARGO_LLVM_COV_SHA256}  $RUNNER_TEMP/cargo-llvm-cov.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/cargo-llvm-cov.tar.gz" -C "$RUNNER_TEMP/cargo-llvm-cov" cargo-llvm-cov

      - name: Build toolchain image
        run: docker build -f registry/Dockerfile --target toolchain -t "$REGISTRY_TOOLCHAIN_IMAGE" .

      # Runs the tests once, saves the totals as JSON for the summary step, then
      # prints the per-file table and exits non-zero if line coverage is below
      # COVERAGE_FLOOR. Run as the checkout's owner so target/ is writable and
      # owned by the runner.
      - name: Coverage
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -e CARGO_HOME=/tmp/cargo \
            -e COVERAGE_FLOOR \
            -v "$RUNNER_TEMP/cargo-llvm-cov:/opt/cargo-llvm-cov:ro" \
            -v "$PWD:/repo" -w /repo "$REGISTRY_TOOLCHAIN_IMAGE" \
            bash -euo pipefail -c '
              rustup component add llvm-tools-preview
              cov=/opt/cargo-llvm-cov/cargo-llvm-cov
              "$cov" llvm-cov --workspace --locked --no-report
              "$cov" llvm-cov report --json --summary-only --output-path target/llvm-cov-summary.json
              "$cov" llvm-cov report --summary-only --fail-under-lines "$COVERAGE_FLOOR"
            '

      # Runs after a pass or a below-floor failure, so the total is always shown.
      - name: Coverage summary
        if: ${{ !cancelled() }}
        run: |
          summary=target/llvm-cov-summary.json
          if [ ! -f "$summary" ]; then
            echo "no coverage report: the Coverage step failed before measuring" >&2
            exit 1
          fi
          lines=$(jq -r '.data[0].totals.lines | "\(.percent * 100 | round / 100)% (\(.covered) of \(.count) lines)"' "$summary")
          if jq -e --argjson floor "$COVERAGE_FLOOR" '.data[0].totals.lines.percent >= $floor' "$summary" >/dev/null; then
            result="at or above the floor"
          else
            result="below the floor"
          fi
          {
            echo "## Coverage"
            echo
            echo "| Measure | Value |"
            echo "| --- | --- |"
            echo "| Workspace line coverage | $lines |"
            echo "| Floor | ${COVERAGE_FLOOR}% |"
            echo "| Result | $result |"
          } | tee -a "$GITHUB_STEP_SUMMARY"

  # Function complexity for the whole Cargo workspace: clippy's
  # `cognitive_complexity` lint, denied, with every other clippy lint allowed, so
  # this job passes or fails on complexity alone. The threshold is set once, in the
  # root `clippy.toml`. cargo runs in the registry Dockerfile's `toolchain` stage,
  # like the `registry` job, so the Rust tag is set in one place and no third-party
  # action sets up Rust. rustup adds clippy for that toolchain's own Rust version.
  # `--workspace --all-targets` with no -p flags, so a crate added to `members` is
  # checked with no change here.
  complexity:
    name: complexity
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      REGISTRY_TOOLCHAIN_IMAGE: family-ai-registry-toolchain:ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build toolchain image
        run: docker build -f registry/Dockerfile --target toolchain -t "$REGISTRY_TOOLCHAIN_IMAGE" .

      # Run as the checkout's owner so target/ is writable and owned by the runner.
      - name: Cognitive complexity
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -e CARGO_HOME=/tmp/cargo \
            -v "$PWD:/repo" -w /repo "$REGISTRY_TOOLCHAIN_IMAGE" \
            bash -euo pipefail -c '
              rustup component add clippy
              cargo clippy --workspace --all-targets --locked -- \
                -A clippy::all -D clippy::cognitive_complexity
            '

  # CPD's Rust lexer scans only tracked Rust files, across all current and future
  # workspace crates. Java and unzip are supplied by the Ubuntu runner image.
  duplication:
    name: duplication
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Published asset digest: https://github.com/pmd/pmd/releases/tag/pmd_releases%2F7.28.0
      PMD_VERSION: 7.28.0
      PMD_SHA256: f974ba571f7bc01c73fffe11bade25fbc1f438698f9e9c00e416e8d65e9fbac2
      # Report 100+ tokens to expose smaller clones without blocking work. Fail
      # at 300+ tokens: a generous initial limit for substantial copy-paste,
      # rather than ordinary Rust/test boilerplate. Tighten with real data later.
      DUPLICATION_REPORT_TOKENS: 100
      DUPLICATION_FAIL_TOKENS: 300
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install PMD CPD
        run: |
          curl -fsSL --retry 5 -o "$RUNNER_TEMP/pmd.zip" \
            "https://github.com/pmd/pmd/releases/download/pmd_releases%2F${PMD_VERSION}/pmd-dist-${PMD_VERSION}-bin.zip"
          echo "${PMD_SHA256}  $RUNNER_TEMP/pmd.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/pmd.zip" -d "$RUNNER_TEMP"

      - name: Rust duplication
        run: |
          git ls-files -z -- '*.rs' > "$RUNNER_TEMP/rust-files.nul"
          file_list="$RUNNER_TEMP/rust-files.txt"
          : > "$file_list"
          while IFS= read -r -d '' file; do
            # CPD's file list uses commas/newlines as separators. Refuse these
            # names so a tracked file cannot silently be omitted or split.
            case "$file" in
              *$'\n'*|*$'\r'*|*,*)
                echo "Rust filename contains a CPD file-list separator" >&2
                exit 1
                ;;
            esac
            # Absolute paths preserve spaces and names beginning with a dash.
            printf '%s/%s\n' "$PWD" "$file" >> "$file_list"
          done < "$RUNNER_TEMP/rust-files.nul"
          if [ ! -s "$file_list" ]; then
            echo "no tracked Rust files found" >&2
            exit 1
          fi
          cpd="$RUNNER_TEMP/pmd-bin-$PMD_VERSION/bin/pmd"
          echo "Reporting duplicates of ${DUPLICATION_REPORT_TOKENS}+ tokens"
          "$cpd" cpd --language rust --file-list "$file_list" \
            --minimum-tokens "$DUPLICATION_REPORT_TOKENS" --no-fail-on-violation --fail-on-error
          echo "Rejecting duplicates of ${DUPLICATION_FAIL_TOKENS}+ tokens"
          "$cpd" cpd --language rust --file-list "$file_list" \
            --minimum-tokens "$DUPLICATION_FAIL_TOKENS" --fail-on-violation --fail-on-error

  # The single required status check. Branch protection requires this job's name
  # (`ci`) and nothing else. It reads the result of every job in `needs:` below, so
  # a job is gated once it is in that list. `if: always()` makes this job run even
  # when a needed job failed; without it a failed job would leave this one skipped,
  # and GitHub can treat a skipped required check as passing. Anything other than
  # `success` (failed, cancelled, skipped) fails it, and so does an empty list.
  ci:
    name: ci
    if: always()
    # Every CI job that must pass before merge is listed here. A new job must be
    # added to this list when it is introduced, or it does not gate merging.
    needs: [image, smoke, workflows, registry, cargo-deny, coverage, duplication, complexity]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      NEEDS: ${{ toJSON(needs) }}
    steps:
      - name: Require every needed job to have succeeded
        run: |
          {
            echo "## CI gate"
            echo
            echo "| Job | Result |"
            echo "| --- | --- |"
            jq -r 'to_entries[] | "| \(.key) | \(.value.result) |"' <<<"$NEEDS"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          if ! jq -e 'length > 0 and all(.[]; .result == "success")' <<<"$NEEDS" >/dev/null; then
            echo "A needed job did not succeed." >&2
            exit 1
          fi
