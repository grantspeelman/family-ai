name: codeql

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, Wednesdays 03:17 UTC. Scheduled runs use the default branch.
    - cron: "17 3 * * 3"

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # Required to upload results to code scanning; CodeQL cannot do it without write.
      # This job runs only CodeQL's own actions, no repo scripts. Fork PRs still get a
      # read-only token from GitHub whatever is set here.
      security-events: write
      # Restated because job-level permissions replace the top-level block. GitHub
      # documents it as required for private repos only; harmless here and keeps the
      # checkout working if the repo ever goes private.
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # CodeQL language identifiers, one entry per analysed language. A PR that
        # introduces a language adds it here (docs/conventions.md, "CodeQL").
        include:
          - language: actions
            build-mode: none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Analyze
        uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          category: "/language:${{ matrix.language }}"
