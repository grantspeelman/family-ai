[package]
name = "fly-mock"
version = "0.1.0"
description = "A local stand-in for Fly's Machines API, for dev and CI"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "process", "rt-multi-thread", "signal"] }

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", default-features = false, features = ["util"] }
