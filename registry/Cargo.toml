[package]
name = "registry"
version = "0.1.0"
description = "The registry app: a GraphQL API for family-ai"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
async-graphql = { version = "7.2.1", default-features = false }
async-graphql-axum = "7.2.1"
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots"] }
serde = { version = "1", features = ["derive"] }
# The `sqlite` feature bundles SQLite into the binary, so the runtime image needs no libsqlite3.
sqlx = { version = "0.8", default-features = false, features = ["sqlite", "runtime-tokio", "migrate", "macros"] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal"] }

[dev-dependencies]
http-body-util = "0.1"
serde_json = "1"
tower = { version = "0.5", default-features = false, features = ["util"] }
