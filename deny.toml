# Apply to all workspace members, features and targets, including future crates.
[graph]
all-features = true

[advisories]
db-urls = ["https://github.com/RustSec/advisory-db"]
yanked = "deny"
unmaintained = "all"
unsound = "all"
# Every ignore needs a reason. Remove each one as soon as a fix can be adopted.
ignore = [
    # Bundled SQLite before 3.54.0 can return uninitialized memory when it opens
    # a database whose -wal file has a different page size. The fix needs
    # libsqlite3-sys >= 0.39, but sqlx 0.8 pins 0.30 and sqlx 0.9 allows only
    # < 0.38. Both apps open only database files they create and write
    # themselves, never files from a less trusted party, so the attack needs
    # write access to the app's own data. Drop this once sqlx allows >= 0.39.
    { id = "RUSTSEC-2026-0459", reason = "fix not reachable through sqlx; apps open only their own database files" },
]

[licenses]
confidence-threshold = 0.93
allow = [
    "MIT", # Permissive, used throughout the current dependency graph.
    "Apache-2.0", # Permissive patent-grant alternative to MIT in many crates.
    "Apache-2.0 WITH LLVM-exception", # Permissive LLVM exception used by wasi.
    "BSD-2-Clause", # Permissive two-clause BSD variant.
    "BSD-3-Clause", # Permissive three-clause BSD variant.
    "ISC", # Permissive MIT-like license.
    "Unicode-3.0", # Permissive Unicode data license, used by unicode-ident.
    "Zlib", # Permissive zlib license, used by foldhash via sqlx.
]

[licenses.private]
# Our unpublished workspace crates use AGPL; do not allow it for dependencies.
ignore = true

[bans]
# Transitive dependency versions are controlled upstream; report duplicates
# without requiring unrelated dependency migrations to adopt this gate.
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
