# .devcontainer/Dockerfile spec: the executable documentation of what the image
# ships. Each command test asserts a pinned version, so when the Dockerfile
# changes a pin, update the matching test in the same commit; CI
# fails otherwise.
#
# Image design:
#   • Base ubuntu:26.04. Node 22, Python 3, Java 25, Rust 1.93, SQLite, gosu and Docker come
#     from the Ubuntu archive, so their tests below pin the series, not the patch release;
#     gh, gitleaks, lefthook, actionlint, zizmor, cargo-deny, PMD and bats-core are pinned, checksummed downloads, pinned exactly.
#   • Remote user `vscode`, UID/GID matched to the host at build time, so the
#     bind-mounted checkout and the forwarded ssh-agent socket line up.
#   • ENTRYPOINT /entrypoint.sh starts as root, starts dockerd only when
#     ENABLE_DOCKER=1 (compose.docker.yml, privileged), then gosu-drops to vscode.
#   • CLAUDE_CONFIG_DIR and CODEX_HOME are named volumes, so the logins survive rebuilds.

schemaVersion: 2.0.0

metadataTest:
  workdir: "/workspace"
  entrypoint: ["/entrypoint.sh"]
  cmd: ["sleep", "infinity"]
  user: root
  envVars:
    - key: CLAUDE_CONFIG_DIR
      value: /home/vscode/.claude
    - key: CODEX_HOME
      value: /home/vscode/.codex
    - key: DISABLE_AUTOUPDATER
      value: "1"

fileExistenceTests:
  - name: workspace mount point exists
    path: /workspace
    shouldExist: true
    uid: 1000

  - name: Claude config dir exists and is vscode-owned (seeds the volume's ownership)
    path: /home/vscode/.claude
    shouldExist: true
    uid: 1000

  - name: Codex home exists and is vscode-owned (seeds the volume's ownership)
    path: /home/vscode/.codex
    shouldExist: true
    uid: 1000

  - name: entrypoint script installed
    path: /entrypoint.sh
    shouldExist: true
    isExecutableBy: any

fileContentTests:
  - name: vscode user in /etc/passwd with correct home and shell
    path: /etc/passwd
    expectedContents: ['vscode:x:1000:1000:[^:]*:/home/vscode:/bin/bash']

  - name: ubuntu base user was renamed, not left alongside vscode
    path: /etc/passwd
    excludedContents: ['^ubuntu:']

  - name: vscode is a member of the docker group (for start.sh --docker)
    path: /etc/group
    expectedContents: ['docker:x:\d+:.*vscode']

  - name: sudoers grants passwordless sudo to vscode
    path: /etc/sudoers.d/vscode
    expectedContents: ['vscode ALL=\(ALL\) NOPASSWD: ALL']

  - name: GitHub SSH host keys are pinned
    path: /etc/ssh/ssh_known_hosts
    expectedContents: ['github\.com ssh-ed25519 ']

commandTests:
  # ── Runtimes ─────────────────────────────────────────────────────────────
  - name: node is 22.x (Ubuntu 26.04 archive)
    command: node
    args: ["--version"]
    # A major-version jump would mean the base image moved; fail rather than drift.
    expectedOutput: ['^v22\.']

  - name: python3 is 3.14 (Ubuntu 26.04 archive)
    command: python3
    args: ["--version"]
    expectedOutput: ['Python 3\.14\.']

  - name: rustc is 1.93 (Ubuntu 26.04 archive)
    command: rustc
    args: ["--version"]
    expectedOutput: ['rustc 1\.93\.']

  - name: cargo is 1.93 (Ubuntu 26.04 archive)
    command: cargo
    args: ["--version"]
    expectedOutput: ['cargo 1\.93\.']

  - name: clippy and rustfmt installed (PR 7 tooling, `cargo fmt`)
    command: bash
    args: ["-c", "cargo clippy --version && cargo fmt --version"]
    expectedOutput: ['clippy 0\.1\.93']

  - name: C toolchain and pkg-config present (cargo links through cc)
    command: bash
    args: ["-c", "cc --version && pkg-config --version"]
    exitCode: 0

  - name: sqlite3 CLI and dev headers installed (family app's database)
    command: bash
    args: ["-c", "sqlite3 --version && pkg-config --exists sqlite3"]
    expectedOutput: ['^3\.']

  - name: python venv module available (for scripts Claude runs)
    command: python3
    args: ["-m", "venv", "--help"]
    exitCode: 0

  # ── Tooling ──────────────────────────────────────────────────────────────
  - name: gh is 2.102.0 (GH_VERSION)
    command: gh
    args: ["--version"]
    expectedOutput: ['gh version 2\.102\.0']

  - name: gitleaks is 8.30.1 (GITLEAKS_VERSION)
    command: gitleaks
    args: ["version"]
    expectedOutput: ['8\.30\.1']

  - name: lefthook is 2.1.15 (LEFTHOOK_VERSION)
    command: lefthook
    args: ["version"]
    expectedOutput: ['2\.1\.15']

  - name: actionlint is 1.7.12 (ACTIONLINT_VERSION)
    command: actionlint
    args: ["-version"]
    expectedOutput: ['^1\.7\.12']

  - name: zizmor is 1.31.1 (ZIZMOR_VERSION)
    command: zizmor
    args: ["--version"]
    expectedOutput: ['^zizmor 1\.31\.1']

  - name: cargo-deny is 0.20.2 (CARGO_DENY_VERSION)
    command: cargo-deny
    args: ["--version"]
    expectedOutput: ['^cargo-deny 0\.20\.2\r?\n?$']

  - name: Java is 25.x (Ubuntu 26.04 archive, PMD CPD runtime)
    command: java
    args: ["-version"]
    expectedError: ['openjdk version "25\.']
    exitCode: 0

  - name: PMD is 7.28.0 (PMD_VERSION)
    command: pmd
    args: ["--version"]
    # PMD prints its banner before the version line; anchor that line explicitly.
    expectedOutput: ['(?m)^PMD 7\.28\.0[[:space:]]']

  - name: PMD CPD detects a 300-token Rust clone
    # CST expands dollar references in arguments before starting the command.
    # Python keeps fixture paths and token values local to the running test.
    command: python3
    args:
      - -c
      - |
        from pathlib import Path
        import subprocess
        import sys
        import tempfile

        with tempfile.TemporaryDirectory(prefix="pmd-cpd-") as directory:
            fixture = Path(directory)
            source = "fn duplicated() {\n"
            source += "".join(f"    let value_{i} = {i};\n" for i in range(58))
            source += "    return ();\n}\n"
            for name in ("first.rs", "second.rs"):
                (fixture / name).write_text(source, encoding="utf-8")
            result = subprocess.run(
                ["pmd", "cpd", "--language", "rust", "--minimum-tokens", "300", "--dir", directory],
                check=False,
            )
        sys.exit(result.returncode)
    expectedOutput: ['300 tokens']
    exitCode: 4

  - name: shellcheck installed (actionlint shell checks)
    command: shellcheck
    args: ["--version"]
    exitCode: 0

  - name: bats is 1.14.0 (BATS_VERSION)
    command: bats
    args: ["--version"]
    expectedOutput: ['Bats 1\.14\.0']

  - name: gosu is 1.19 (Ubuntu 26.04 archive)
    command: gosu
    args: ["--version"]
    expectedOutput: ['1\.19']

  - name: claude CLI available
    command: claude
    args: ["--version"]
    # Deliberately unpinned (see the Dockerfile); just assert the CLI runs.
    exitCode: 0

  - name: codex CLI available
    command: codex
    args: ["--version"]
    # Deliberately unpinned (see the Dockerfile); just assert the CLI runs.
    exitCode: 0

  - name: docker CLI and daemon installed (daemon only runs with --docker)
    command: bash
    args: ["-c", "docker --version && dockerd --version && containerd --version"]
    expectedOutput: ['Docker version']

  - name: bubblewrap and socat installed (Claude Code's Linux sandbox)
    command: bash
    args: ["-c", "bwrap --version && socat -V"]
    expectedOutput: ['bubblewrap \d']

  - name: baseline utilities installed
    command: bash
    args: ["-c", "git --version && jq --version && rg --version && ssh -V"]
    exitCode: 0
