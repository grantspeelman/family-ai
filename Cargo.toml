# Cargo workspace for the Rust code in this repo. Each member is a crate in its
# own directory; add new ones to `members` and to the COPY lines in
# registry/Dockerfile, because cargo loads every member.
[workspace]
members = ["family-app", "fly-mock", "registry"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "AGPL-3.0-only"
# Bump together with RUST_VERSION in .devcontainer/Dockerfile and the rust tag in
# registry/Dockerfile; .devcontainer/rust-version-check.sh fails CI if they differ.
rust-version = "1.93"
