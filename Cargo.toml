# Cargo workspace for the Rust code in this repo. Each member is a crate in its
# own directory; add new ones to `members` and to the COPY lines in
# registry/Dockerfile, because cargo loads every member.
[workspace]
members = ["fly-mock", "registry"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "AGPL-3.0-only"
rust-version = "1.93"
